<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Özelge Tarama</title>
<style>
:root {
  --bg: #f2f4f6; --panel: #ffffff; --ink: #16222c; --muted: #5d6b77;
  --line: #d9dee3; --accent: #1b5b78; --accent2: #2a7da0; --accent-ink: #fff;
  --err: #a63a2a; --star: #e6a817; --green: #1e7a4a; --nav-h: 62px;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12181d; --panel: #1a222a; --ink: #e6ebef; --muted: #9aa8b4;
    --line: #2b3641; --accent: #6fb4d1; --accent2: #5a9fb8; --accent-ink: #0c1a22;
    --err: #ec8f7e; --star: #f0c060; --green: #4caf82;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}

/* ── BOTTOM NAV ── */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:80;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);}
.nav-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;color:var(--muted);font:inherit;
  font-size:10px;font-weight:500;cursor:pointer;padding:6px 0;min-height:0;}
.nav-tab svg{width:22px;height:22px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-tab.active{color:var(--accent);}

/* ── SCREENS ── */
.screen{display:none;}.screen.active{display:block;}
.page-header{padding:14px 16px 6px;font-size:20px;font-weight:700;letter-spacing:-.01em;}
.page-header small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px;}

/* ── SHARED COMPONENTS ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);}
.section{margin:0 12px 12px;}
.section-title{font-size:13px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;}
btn,.btn{font:inherit;font-weight:600;min-height:44px;border-radius:8px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  padding:0 16px;cursor:pointer;width:100%;}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn-sm{min-height:36px;font-size:14px;padding:0 12px;width:auto;}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px;width:100%;min-height:44px;}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.input-ico{position:relative;}
.input-ico svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.input-ico input{padding-left:36px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
label.lbl{display:grid;gap:4px;font-size:13px;color:var(--muted);}

/* ── CHIPS ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font:inherit;font-size:14px;font-weight:500;padding:7px 14px;
  border-radius:20px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);cursor:pointer;min-height:0;white-space:nowrap;}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

/* ── ANA SAYFA ── */
#ana-search-box{margin:8px 12px 10px;padding:14px;display:grid;gap:10px;}
#ana-search-box.card{}
.quick-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.quick-filters::-webkit-scrollbar{display:none;}
#recent-list{display:grid;gap:6px;}
.recent-item{padding:10px 12px;display:flex;align-items:flex-start;gap:10px;
  text-align:left;color:var(--ink);font-weight:400;background:none;
  border:none;border-bottom:1px solid var(--line);width:100%;cursor:pointer;min-height:0;}
.recent-item:last-child{border-bottom:none;}
.recent-item svg{stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;
  flex-shrink:0;margin-top:2px;width:16px;height:16px;}
.recent-item .ri-t{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:2px;}
.recent-item .ri-m{font-size:12px;color:var(--muted);}
.popular-chips{display:flex;flex-wrap:wrap;gap:6px;}
.pop-chip{font:inherit;font-size:14px;padding:7px 14px;border-radius:20px;
  border:1px solid var(--line);background:var(--panel);color:var(--accent);
  cursor:pointer;min-height:0;font-weight:500;}

/* ── GELİŞMİŞ ARAMA ── */
#screen-arama-form .aform{margin:8px 12px;padding:14px;display:grid;gap:12px;}
.kanun-btn{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 36px 10px 10px;width:100%;min-height:44px;
  text-align:left;position:relative;cursor:pointer;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kanun-btn::after{content:"▾";position:absolute;right:12px;top:50%;
  transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.kanun-btn.filtered{border-color:var(--accent);color:var(--accent);font-weight:600;}
.kanun-btn.filtered::after{color:var(--accent);}
.checkbox-row{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;}
.checkbox-row input[type=checkbox]{width:20px;height:20px;flex-shrink:0;
  accent-color:var(--accent);cursor:pointer;}
.checkbox-row span{font-size:15px;}
.sort-btn{font:inherit;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 36px 10px 10px;width:100%;min-height:44px;
  text-align:left;position:relative;cursor:pointer;color:var(--ink);}
.sort-btn::after{content:"▾";position:absolute;right:12px;top:50%;
  transform:translateY(-50%);color:var(--muted);pointer-events:none;}

/* ── SONUÇLAR ── */
#results-header{padding:8px 12px 4px;display:flex;align-items:center;justify-content:space-between;}
#results-header .rh-info{font-size:13px;color:var(--muted);}
#results-header .rh-back{font:inherit;background:none;border:none;
  color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;padding:0;min-height:0;}
#result-list{padding:0 12px 16px;display:grid;gap:8px;}
.r-item{padding:12px;text-align:left;color:var(--ink);font-weight:400;
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;
  cursor:pointer;width:100%;min-height:0;}
.r-item .ri-left{display:grid;gap:4px;}
.r-item .t{font-weight:600;font-size:15px;line-height:1.35;}
.r-item .m{font-size:12px;color:var(--muted);}
.r-item .star-btn{background:none;border:none;font-size:20px;cursor:pointer;
  padding:2px 0 2px 4px;color:var(--line);min-height:0;flex-shrink:0;}
.r-item .star-btn.starred{color:var(--star);}
#more-btn{margin:0 12px 16px;width:calc(100% - 24px);}

/* ── KANUNLAR ── */
#k-list{padding:0 12px 24px;display:grid;gap:8px;}
.k-item{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;text-align:left;color:var(--ink);font-weight:400;width:100%;min-height:0;}
.k-item .ki-left{display:grid;gap:2px;}
.k-item .ki-no{font-size:12px;color:var(--muted);}
.k-item .ki-title{font-weight:600;font-size:15px;line-height:1.3;}
.k-item .ki-count{background:var(--bg);border:1px solid var(--line);border-radius:20px;
  padding:3px 10px;font-size:13px;color:var(--muted);white-space:nowrap;margin-left:12px;flex-shrink:0;}
.k-item.all .ki-title{color:var(--accent);}
.k-item.all .ki-count{border-color:var(--accent);color:var(--accent);}

/* ── FAVORİLER ── */
#fav-list{padding:0 12px 24px;display:grid;gap:8px;}
.fav-item{padding:12px 14px;display:grid;grid-template-columns:1fr auto;
  gap:8px;align-items:start;cursor:pointer;text-align:left;color:var(--ink);
  font-weight:400;width:100%;min-height:0;}
.fav-item .t{font-weight:600;font-size:15px;line-height:1.3;}
.fav-item .m{font-size:12px;color:var(--muted);margin-top:3px;}
.fav-item .del-btn{background:none;border:none;font-size:18px;color:var(--muted);
  cursor:pointer;padding:0;min-height:0;line-height:1;}
.empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
.empty-state svg{width:48px;height:48px;stroke:var(--line);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px;}
.empty-state p{margin:0;font-size:15px;}

/* ── GEÇMİŞ ── */
#gecmis-list{padding:0 12px 24px;display:grid;gap:8px;}
.gecmis-item{padding:12px 14px;display:grid;grid-template-columns:1fr auto;
  gap:8px;align-items:center;cursor:pointer;text-align:left;color:var(--ink);
  font-weight:400;width:100%;min-height:0;}
.gecmis-item .gi-q{font-weight:600;font-size:15px;}
.gecmis-item .gi-m{font-size:12px;color:var(--muted);margin-top:3px;}
.gecmis-item .gi-run{font:inherit;font-size:13px;font-weight:600;
  color:var(--accent);background:none;border:none;cursor:pointer;
  padding:4px 8px;min-height:0;white-space:nowrap;}

/* ── KANUN MODAL ── */
#kanun-modal{display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.45);align-items:flex-end;}
#kanun-modal.open{display:flex;}
#kanun-sheet{background:var(--panel);border-radius:16px 16px 0 0;
  width:100%;max-height:82vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);}
.sh-head{padding:16px 16px 10px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--line);}
.sh-head strong{font-size:17px;}
.sh-close{background:none;border:none;font-size:26px;color:var(--muted);
  min-height:0;padding:0 4px;cursor:pointer;line-height:1;}
.sh-search-wrap{padding:10px 12px;}
#modal-k-list{overflow-y:auto;flex:1;}
.k-row{display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--line);cursor:pointer;background:none;
  border-left:none;border-right:none;border-top:none;width:100%;
  text-align:left;color:var(--ink);font-size:15px;}
.k-row .kn{font-size:12px;color:var(--muted);min-width:34px;flex-shrink:0;}
.k-row .kt{flex:1;font-weight:500;}
.k-row .kc{font-size:12px;color:var(--muted);flex-shrink:0;
  background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 8px;}
.k-row.sel .kt{color:var(--accent);font-weight:700;}
.k-row.sel .kn{color:var(--accent);}

/* ── DETAY ── */
#detail{display:none;position:fixed;inset:0;background:var(--bg);
  overflow-y:auto;z-index:300;padding-top:env(safe-area-inset-top);}
#detail .dbar{position:sticky;top:0;background:var(--bg);
  padding:10px 12px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);}
#detail .dbar .d-back{font:inherit;font-weight:600;color:var(--accent);
  background:none;border:none;cursor:pointer;padding:0;min-height:0;font-size:15px;}
#detail .dbar .d-star{font-size:22px;background:none;border:none;
  color:var(--line);cursor:pointer;padding:0;min-height:0;margin-left:auto;}
#detail .dbar .d-star.on{color:var(--star);}
#detail .dbar .d-copy{font:inherit;font-weight:600;color:var(--accent);
  background:none;border:none;cursor:pointer;padding:0 4px;min-height:0;font-size:14px;}
#detail .dbar .d-share{font:inherit;font-weight:600;color:var(--accent);
  background:none;border:none;cursor:pointer;padding:0 4px;min-height:0;font-size:14px;}
#detail .dhead{padding:14px 16px 8px;}
#detail h2{margin:0 0 10px;font-size:18px;line-height:1.35;}
#detail .dmeta{display:grid;gap:4px;}
#detail .dmeta-row{font-size:13px;color:var(--muted);}
#detail .dmeta-row strong{color:var(--ink);}
#dbody{margin:8px 12px 32px;padding:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);
  font:16px/1.7 Georgia,"Times New Roman",serif;overflow-x:auto;}
#dbody p{margin:0 0 .8em;}
#dbody table{max-width:100%;border-collapse:collapse;}
#dbody td,#dbody th{vertical-align:top;padding:2px 4px;}

/* status bar */
#status{padding:4px 16px;font-size:13px;color:var(--muted);min-height:22px;}
#status.err{color:var(--err);}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     1. ANA SAYFA
═══════════════════════════════════════ -->
<div id="screen-ana" class="screen active">
  <div class="page-header">
    Özelge Tarama
    <small>GİB mevzuat veritabanı · <span id="total-count">…</span></small>
  </div>

  <!-- Arama kutusu -->
  <div id="ana-search-box" class="card section">
    <div class="input-ico">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="ana-q" type="search" placeholder="Özelge, konu veya anahtar kelime ara…"
             autocomplete="off" enterkeyhint="search">
    </div>
    <!-- Hızlı zaman filtreleri -->
    <div class="quick-filters" id="quick-filters">
      <button class="chip active" data-days="">Tüm zamanlar</button>
      <button class="chip" data-days="30">Son 1 Ay</button>
      <button class="chip" data-days="90">Son 3 Ay</button>
      <button class="chip" data-days="365">Son 1 Yıl</button>
    </div>
    <button class="btn" id="ana-ara-btn">Ara</button>
    <button class="btn btn-ghost" id="gelismis-btn" style="min-height:38px;font-size:14px;">
      ⚙ Gelişmiş Filtreler
    </button>
  </div>

  <!-- Hızlı Erişim -->
  <div class="section">
    <div class="section-title">Hızlı Erişim</div>
    <div class="row2" style="gap:8px;">
      <button class="card chip" style="border-radius:var(--r);padding:14px;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;" onclick="showTab('screen-kanunlar')">
        <svg style="width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Kanunlar
      </button>
      <button class="card chip" style="border-radius:var(--r);padding:14px;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;" onclick="showTab('screen-favoriler')">
        <svg style="width:20px;height:20px;stroke:var(--star);fill:none;stroke-width:2;stroke-linecap:round;" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Favoriler
      </button>
      <button class="card chip" style="border-radius:var(--r);padding:14px;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;" onclick="showTab('screen-gecmis')">
        <svg style="width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Arama Geçmişi
      </button>
      <button class="card chip" id="kayitli-btn" style="border-radius:var(--r);padding:14px;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;" onclick="showTab('screen-gecmis')">
        <svg style="width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Kayıtlı Aramalar
      </button>
    </div>
  </div>

  <!-- Son Eklenen -->
  <div class="section">
    <div class="section-title">Son Eklenen Özelgeler</div>
    <div class="card" id="son-ozelgeler">
      <div style="padding:16px;text-align:center;color:var(--muted);font-size:14px;">Yükleniyor…</div>
    </div>
  </div>

  <!-- Popüler Konular -->
  <div class="section">
    <div class="section-title">Popüler Konular</div>
    <div class="popular-chips">
      <button class="pop-chip" data-q="KDV">KDV</button>
      <button class="pop-chip" data-q="tapu harcı">Tapu Harcı</button>
      <button class="pop-chip" data-q="e-ticaret">E-ticaret</button>
      <button class="pop-chip" data-q="kira geliri">Kira Geliri</button>
      <button class="pop-chip" data-q="istisna">İstisna</button>
      <button class="pop-chip" data-q="e-fatura">E-fatura</button>
      <button class="pop-chip" data-q="şirket devri">Şirket Devri</button>
      <button class="pop-chip" data-q="araç satışı">Araç Satışı</button>
      <button class="pop-chip" data-q="stopaj">Stopaj</button>
      <button class="pop-chip" data-q="arsa satışı">Arsa Satışı</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     2. GELİŞMİŞ ARAMA FORMU
═══════════════════════════════════════ -->
<div id="screen-arama-form" class="screen">
  <div class="page-header">Gelişmiş Arama</div>
  <div class="aform card section">
    <label class="lbl">Arama metni
      <div class="input-ico">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="f-q" type="search" placeholder="Konu veya anahtar kelime" autocomplete="off">
      </div>
    </label>
    <label class="lbl">Kanun
      <button type="button" class="kanun-btn" id="f-kanun-btn">Tüm kanunlar</button>
    </label>
    <label class="lbl">Özelge numarası
      <div class="input-ico">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <input id="f-no" type="search" placeholder="E-..." autocomplete="off">
      </div>
    </label>
    <div class="row2">
      <label class="lbl">Başlangıç tarihi<input id="f-d1" type="date"></label>
      <label class="lbl">Bitiş tarihi<input id="f-d2" type="date"></label>
    </div>
    <div>
      <div class="section-title" style="margin-bottom:6px;">Arama yapılacak alan</div>
      <label class="checkbox-row"><input type="checkbox" id="f-baslik" checked><span>Başlıkta ara</span></label>
      <label class="checkbox-row"><input type="checkbox" id="f-guncel"><span>Sadece güncel özelgeler</span></label>
    </div>
    <label class="lbl">Sonuçları sırala
      <select id="f-sort" style="font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-height:44px;">
        <option value="DESC">Yeni → Eski</option>
        <option value="ASC">Eski → Yeni</option>
      </select>
    </label>
    <button class="btn" id="f-ara-btn">Ara</button>
    <button class="btn btn-ghost" id="f-temizle-btn">Temizle</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     3. ARAMA SONUÇLARI
═══════════════════════════════════════ -->
<div id="screen-sonuclar" class="screen">
  <div id="results-header">
    <button class="rh-back" id="results-back-btn">← Aramaya Dön</button>
    <div class="rh-info" id="results-info"></div>
  </div>
  <div id="status"></div>
  <div id="result-list"></div>
  <button class="btn btn-ghost" id="more-btn" hidden>Daha fazla yükle</button>
</div>

<!-- ══════════════════════════════════════
     4. KANUNLAR
═══════════════════════════════════════ -->
<div id="screen-kanunlar" class="screen">
  <div class="page-header">Kanunlar<small>Kanuna göre özelge listesi</small></div>
  <div class="section" style="margin-bottom:8px;">
    <div class="input-ico">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="k-search" type="search" placeholder="Kanunlarda ara…" autocomplete="off">
    </div>
  </div>
  <div id="k-list"></div>
</div>

<!-- ══════════════════════════════════════
     5. FAVORİLER
═══════════════════════════════════════ -->

<!-- ══════════════════════════════════════

<div id="kanun-modal" role="dialog" aria-modal="true">

<!-- ══════════════════════════════════════
     DETAY

<div id="detail">
  <div class="dbar">

  </div>
  <div class="dhead">
    <h2 id="d-title"></h2>
    <div class="dmeta">
      <div class="dmeta-row"><strong>Tarih</strong> <span id="d-tarih"></span></div>
      <div class="dmeta-row"><strong>Kanun</strong> <span id="d-kanun"></span></div>
      <div class="dmeta-row"><strong>Özelge No</strong> <span id="d-no"></span></div>
    </div>
  </div>
  <div id="dbody"></div>
</div>

<script>
/* ════════════════════════════
   SABITLER & DURUM
════════════════════════════ */
const API = "https://gib.gov.tr/api/gibportal/mevzuat/";
const HDR = {"Content-Type":"application/json","Accept":"application/json,text/plain,*/*","Referer":"https://www.gib.gov.tr/"};
const $ = id => document.getElementById(id);

let allKanunlar = [];
let selectedKanun = {id:"", label:"Tüm kanunlar"};  // form'daki seçili kanun
let currentItem = null;  // açık detay
let searchState = {page:0,totalPages:0,done:true,items:[],busy:false,filters:null,sort:"DESC"};

/* ════════════════════════════
   STORAGE — Favoriler & Geçmiş
════════════════════════════ */
function getFavs(){try{return JSON.parse(localStorage.getItem("ozt_favs")||"[]");}catch{return [];}}
function setFavs(a){try{localStorage.setItem("ozt_favs",JSON.stringify(a));}catch{}}
function isFav(id){return getFavs().some(f=>f.id==id);}
function toggleFav(item){
  let favs=getFavs();
  if(favs.some(f=>f.id==item.id)){
    favs=favs.filter(f=>f.id!=item.id);
  } else {
    favs.unshift({id:item.id,title:item.title,kanunTitle:item.kanunTitle,
      ozelgeNo:item.ozelgeNo,ozelgeTarih:item.ozelgeTarih,description:item.description});
    if(favs.length>500) favs=favs.slice(0,500);
  }
  setFavs(favs);
}

function getGecmis(){try{return JSON.parse(localStorage.getItem("ozt_gecmis")||"[]");}catch{return [];}}
function addGecmis(filters){
  const label = [filters.q, filters.kanunLabel&&filters.kanunLabel!=="Tüm kanunlar"?"["+filters.kanunLabel+"]":""].filter(Boolean).join(" ");
  if(!label) return;
  let g=getGecmis().filter(x=>x.label!==label);
  g.unshift({label, filters, ts:Date.now()});
  if(g.length>50) g=g.slice(0,50);
  try{localStorage.setItem("ozt_gecmis",JSON.stringify(g));}catch{}
}

/* ════════════════════════════
   API
════════════════════════════ */
async function post(path, params, body){
  const r=await fetch(API+path+"?"+new URLSearchParams(params),
    {method:"POST",headers:HDR,body:JSON.stringify(body)});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return (await r.json()).resultContainer;
}

function fmtDate(iso){return (iso||"").slice(0,10).split("-").reverse().join(".");}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ════════════════════════════
   KANUNLAR
════════════════════════════ */
async function loadKanunlar(){
  try{
    const rc=await post("kanun/filterList",
      {page:0,size:1000,sortFieldName:"priority",sortType:"ASC"},{kanunType:99});
    allKanunlar=Array.isArray(rc)?rc:(rc.content||[]);
    renderKScreen(""); renderModal("");
  }catch(e){setStatus("Kanun listesi alınamadı: "+e.message,true);}
}

function filterK(q){
  if(!q) return allKanunlar;
  const lq=q.toLowerCase();
  return allKanunlar.filter(k=>((k.kanunNo||"")+" "+(k.title||"")).toLowerCase().includes(lq));
}

function renderKScreen(q){
  const list=$("k-list"); list.innerHTML="";
  const filtered=filterK(q);
  const total=allKanunlar.reduce((s,k)=>s+(k.count||0),0);

  const all=document.createElement("button"); all.className="k-item all card";
  all.innerHTML=`<div class="ki-left"><div class="ki-title">Tüm kanunlar</div></div><span class="ki-count">${total||"…"}</span>`;
  all.onclick=()=>applyKanunSearch("","Tüm kanunlar"); list.appendChild(all);

  filtered.forEach(k=>{
    const label=(k.kanunNo?k.kanunNo+" – ":"")+k.title;
    const el=document.createElement("button"); el.className="k-item card";
    el.innerHTML=`<div class="ki-left">${k.kanunNo?`<div class="ki-no">${esc(k.kanunNo)}</div>`:""}<div class="ki-title">${esc(k.title)}</div></div>`+
      (k.count?`<span class="ki-count">${k.count}</span>`:"");
    el.onclick=()=>applyKanunSearch(k.id,label); list.appendChild(el);
  });
}

function applyKanunSearch(id,label){
  // Kanunlar ekranından kanun seçince gelişmiş aramaya taşı
  selectedKanun={id,label};
  $("f-kanun-btn").textContent=label;
  $("f-kanun-btn").className=id?"kanun-btn filtered":"kanun-btn";
  $("f-q").value="";
  runSearch();
}

function renderModal(q){
  const list=$("modal-k-list"); list.innerHTML="";
  const filtered=filterK(q);
  const total=allKanunlar.reduce((s,k)=>s+(k.count||0),0);

  const all=document.createElement("button"); all.className="k-row"+(selectedKanun.id===""?" sel":"");
  all.innerHTML=`<span class="kt">Tüm kanunlar</span><span class="kc">${total||""}</span>`;
  all.onclick=()=>{selectedKanun={id:"",label:"Tüm kanunlar"};syncKanunBtn();closeModal();};
  list.appendChild(all);

  filtered.forEach(k=>{
    const label=(k.kanunNo?k.kanunNo+" – ":"")+k.title;
    const row=document.createElement("button");
    row.className="k-row"+(selectedKanun.id==k.id?" sel":"");
    row.innerHTML=`<span class="kn">${esc(k.kanunNo||"")}</span><span class="kt">${esc(k.title)}</span>`+
      (k.count?`<span class="kc">${k.count}</span>`:"");
    row.onclick=()=>{selectedKanun={id:k.id,label};syncKanunBtn();closeModal();};
    list.appendChild(row);
  });
}

function syncKanunBtn(){
  $("f-kanun-btn").textContent=selectedKanun.label;
  $("f-kanun-btn").className=selectedKanun.id?"kanun-btn filtered":"kanun-btn";
}

$("f-kanun-btn").onclick=()=>{renderModal($("modal-k-search").value);openModal();};
$("modal-close").onclick=closeModal;
$("kanun-modal").addEventListener("click",e=>{if(e.target===$("kanun-modal"))closeModal();});
$("modal-k-search").addEventListener("input",e=>renderModal(e.target.value));
function openModal(){$("kanun-modal").classList.add("open");setTimeout(()=>$("modal-k-search").focus(),80);}
function closeModal(){$("kanun-modal").classList.remove("open");}

$("k-search").addEventListener("input",e=>renderKScreen(e.target.value));

/* ════════════════════════════
   SEKME NAVİGASYONU
════════════════════════════ */
function showTab(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active"));
  $(id).classList.add("active");
  const navBtn=document.querySelector(`[data-tab="${id}"]`);
  if(navBtn) navBtn.classList.add("active");
  if(id==="screen-favoriler") renderFavs();
  if(id==="screen-gecmis") renderGecmis();
}
document.querySelectorAll(".nav-tab").forEach(btn=>{
  btn.addEventListener("click",()=>showTab(btn.dataset.tab));
});

/* ════════════════════════════
   ARAMA
════════════════════════════ */
function buildBody(f){
  const b={status:2,deleted:false,ktype:99};
  if(f.kanun) b.kanunIds=[Number(f.kanun)];
  if(f.q) b.title=f.q;
  if(f.ozelgeNo) b.ozelgeNo=f.ozelgeNo;
  return b;
}

function setStatus(msg,isErr){
  $("status").textContent=msg||"";
  $("status").className=isErr?"err":"";
}

async function fetchPage(){
  if(searchState.busy||searchState.done) return;
  searchState.busy=true;
  const f=searchState.filters;
  let added=0; const target=20;
  try{
    while(!searchState.done&&added<target){
      setStatus("Yükleniyor…");
      const rc=await post("ozelge/list",
        {page:searchState.page,size:50,sortFieldName:"ozelgeTarih",sortType:searchState.sort},
        buildBody(f));
      searchState.totalPages=rc.totalPages;
      for(const it of rc.content){
        const d=(it.ozelgeTarih||"").slice(0,10);
        if(f.d2&&d>f.d2) continue;
        if(f.d1&&d<f.d1){searchState.done=true;break;}
        searchState.items.push(it); added++;
      }
      searchState.page++;
      if(searchState.page>=searchState.totalPages) searchState.done=true;
    }
    renderResults();
    setStatus(searchState.items.length
      ? searchState.items.length+" özelge"+(searchState.done?"":" (devamı var)")
      : "Sonuç bulunamadı.");
  }catch(e){
    setStatus("Bağlantı hatası: "+e.message, true);
  }finally{
    searchState.busy=false;
  }
}

function runSearch(fromAna){
  let q="", kanun="", kanunLabel="Tüm kanunlar", d1="", d2="", ozelgeNo="", sort="DESC";

  if(fromAna){
    q=$("ana-q").value.trim();
    kanun=""; kanunLabel="Tüm kanunlar";
    // hızlı zaman filtresi
    const activeDay=$("quick-filters").querySelector(".chip.active");
    if(activeDay&&activeDay.dataset.days){
      const days=Number(activeDay.dataset.days);
      const dt=new Date(); dt.setDate(dt.getDate()-days);
      d1=dt.toISOString().slice(0,10);
    }
    // sonuçlar sayfasına geç
    $("results-back-btn").dataset.back="screen-ana";
  } else {
    // Gelişmiş form
    q=$("f-q").value.trim();
    kanun=selectedKanun.id;
    kanunLabel=selectedKanun.label;
    d1=$("f-d1").value; d2=$("f-d2").value;
    ozelgeNo=$("f-no").value.trim();
    sort=$("f-sort").value;
    $("results-back-btn").dataset.back="screen-arama-form";
  }

  addGecmis({q,kanun,kanunLabel,d1,d2,ozelgeNo});

  searchState={page:0,totalPages:0,done:false,items:[],busy:false,
    filters:{q,kanun,d1,d2,ozelgeNo},sort};
  $("result-list").innerHTML="";
  $("more-btn").hidden=true;

  const info=[];
  if(q) info.push('"'+q+'"');
  if(kanunLabel&&kanunLabel!=="Tüm kanunlar") info.push(kanunLabel);
  $("results-info").textContent=info.join(" · ");

  showTab("screen-sonuclar");
  fetchPage();
}

function renderResults(){
  const list=$("result-list");
  searchState.items.forEach((it,i)=>{
    if(list.children[i]) return;  // zaten render edilmiş
    const el=document.createElement("button");
    el.className="r-item card";
    const starred=isFav(it.id);
    el.innerHTML=`<div class="ri-left">
      <div class="t">${esc(it.title||"(başlıksız)")}</div>
      <div class="m">${fmtDate(it.ozelgeTarih)} · ${esc(it.kanunTitle||"")} · ${esc(it.ozelgeNo||"")}</div>
    </div>
    <button class="star-btn${starred?" starred":""}" data-idx="${i}" title="Favorilere ekle">${starred?"★":"☆"}</button>`;

    el.querySelector(".star-btn").addEventListener("click",e=>{
      e.stopPropagation();
      const idx=Number(e.currentTarget.dataset.idx);
      toggleFav(searchState.items[idx]);
      const on=isFav(searchState.items[idx].id);
      e.currentTarget.textContent=on?"★":"☆";
      e.currentTarget.className="star-btn"+(on?" starred":"");
    });
    el.addEventListener("click",()=>openDetail(searchState.items[i]));
    list.appendChild(el);
  });
  $("more-btn").hidden=searchState.done||!searchState.items.length;
}

$("more-btn").onclick=fetchPage;

/* ── Ana sayfa ara ── */
$("ana-ara-btn").onclick=()=>runSearch(true);
$("ana-q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runSearch(true);}});

/* ── Hızlı filtreler ── */
$("quick-filters").querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("click",()=>{
    $("quick-filters").querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
    c.classList.add("active");
  });
});

/* ── Gelişmiş ── */
$("gelismis-btn").onclick=()=>showTab("screen-arama-form");
$("f-ara-btn").onclick=()=>runSearch(false);
$("f-temizle-btn").onclick=()=>{
  selectedKanun={id:"",label:"Tüm kanunlar"}; syncKanunBtn();
  $("f-q").value=""; $("f-no").value="";
  $("f-d1").value=""; $("f-d2").value="";
  $("f-baslik").checked=true; $("f-guncel").checked=false; $("f-sort").value="DESC";
};
["f-q","f-no"].forEach(id=>{
  $(id).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runSearch(false);}});
});

/* ── Popüler konular ── */
document.querySelectorAll(".pop-chip").forEach(c=>{
  c.addEventListener("click",()=>{
    $("ana-q").value=c.dataset.q;
    // zaman filtresini sıfırla
    $("quick-filters").querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
    $("quick-filters").querySelector('[data-days=""]').classList.add("active");
    runSearch(true);
  });
});

/* ── Sonuçlar geri ── */
$("results-back-btn").addEventListener("click",()=>{
  const back=$("results-back-btn").dataset.back||"screen-ana";
  showTab(back);
});

/* ════════════════════════════
   FAVORİLER
════════════════════════════ */
function renderFavs(){
  const list=$("fav-list"); list.innerHTML="";
  const favs=getFavs();
  if(!favs.length){
    list.innerHTML=`<div class="empty-state">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <p>Henüz favori eklemediniz.<br>Özelge listesinde ☆ simgesine dokunun.</p>
    </div>`; return;
  }
  favs.forEach((it,i)=>{
    const el=document.createElement("div");
    el.className="fav-item card section"; el.style.cursor="pointer"; el.style.margin="0 12px 8px";
    el.innerHTML=`<div>
      <div class="t">${esc(it.title||"(başlıksız)")}</div>
      <div class="m">${fmtDate(it.ozelgeTarih)} · ${esc(it.kanunTitle||"")} · ${esc(it.ozelgeNo||"")}</div>
    </div>
    <button class="del-btn" data-i="${i}" title="Sil">✕</button>`;
    el.querySelector(".del-btn").addEventListener("click",e=>{
      e.stopPropagation();
      const favs2=getFavs(); favs2.splice(Number(e.currentTarget.dataset.i),1);
      setFavs(favs2); renderFavs();
    });
    el.addEventListener("click",()=>openDetail(it));
    list.appendChild(el);
  });
}

/* ════════════════════════════
   GEÇMİŞ
════════════════════════════ */
function renderGecmis(){
  const list=$("gecmis-list"); list.innerHTML="";
  const g=getGecmis();
  if(!g.length){
    list.innerHTML=`<div class="empty-state">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <p>Arama geçmişiniz burada görünür.</p>
    </div>`; return;
  }
  g.forEach((item,i)=>{
    const el=document.createElement("div");
    el.className="gecmis-item card"; el.style.margin="0 12px 8px";
    const f=item.filters;
    const meta=[f.kanunLabel&&f.kanunLabel!=="Tüm kanunlar"?f.kanunLabel:null,
      f.d1?f.d1.split("-").reverse().join(".")+" – "+(f.d2?f.d2.split("-").reverse().join("."):"")+" tarihleri":null
    ].filter(Boolean).join(" · ");
    el.innerHTML=`<div>
      <div class="gi-q">${esc(item.label)}</div>
      ${meta?`<div class="gi-m">${esc(meta)}</div>`:""}
    </div>
    <button class="gi-run" data-i="${i}">▶ Tekrar</button>`;
    el.querySelector(".gi-run").addEventListener("click",e=>{
      e.stopPropagation();
      const fi=getGecmis()[Number(e.currentTarget.dataset.i)]?.filters;
      if(!fi) return;
      // formu doldur
      $("f-q").value=fi.q||"";
      $("f-no").value=fi.ozelgeNo||"";
      $("f-d1").value=fi.d1||""; $("f-d2").value=fi.d2||"";
      selectedKanun={id:fi.kanun||"",label:fi.kanunLabel||"Tüm kanunlar"};
      syncKanunBtn();
      runSearch(false);
    });
    list.appendChild(el);
  });
}
$("gecmis-temizle").onclick=()=>{
  try{localStorage.removeItem("ozt_gecmis");}catch{}
  renderGecmis();
};

/* ════════════════════════════
   DETAY
════════════════════════════ */
function sanitize(html){
  const doc=new DOMParser().parseFromString(html||"","text/html");
  doc.querySelectorAll("script,style,iframe,object,embed,link,meta").forEach(n=>n.remove());
  doc.querySelectorAll("*").forEach(n=>[...n.attributes].forEach(a=>{
    if(/^on/i.test(a.name)||/^javascript:/i.test(a.value)) n.removeAttribute(a.name);
  }));
  return doc.body.innerHTML;
}

function openDetail(it){
  currentItem=it;
  $("d-title").textContent=it.title||"";
  $("d-tarih").textContent=fmtDate(it.ozelgeTarih);
  $("d-kanun").textContent=it.kanunTitle||"";
  $("d-no").textContent=it.ozelgeNo||"";
  $("dbody").innerHTML=sanitize(it.description);
  // favori durumu
  const on=isFav(it.id);
  $("d-star").textContent=on?"★":"☆";
  $("d-star").className=on?"d-star on":"d-star";
  $("detail").style.display="block";
  $("detail").scrollTop=0;
  history.pushState({d:1},"");
}

$("d-back").onclick=()=>history.back();
window.addEventListener("popstate",()=>{if($("detail").style.display==="block")$("detail").style.display="none";});

$("d-star").onclick=()=>{
  if(!currentItem) return;
  toggleFav(currentItem);
  const on=isFav(currentItem.id);
  $("d-star").textContent=on?"★":"☆";
  $("d-star").className=on?"d-star on":"d-star";
};

$("d-copy").onclick=async()=>{
  const text=($("d-title").textContent+"\n"+
    $("d-tarih").textContent+" · "+$("d-kanun").textContent+" · "+$("d-no").textContent+
    "\n\n"+$("dbody").innerText);
  try{await navigator.clipboard.writeText(text);$("d-copy").textContent="Kopyalandı ✓";}
  catch{$("d-copy").textContent="Kopyalanamadı";}
  setTimeout(()=>{$("d-copy").textContent="Kopyala";},1800);
};

$("d-share").onclick=async()=>{
  const title=$("d-title").textContent;
  const text=$("d-tarih").textContent+" · "+$("d-kanun").textContent;
  if(navigator.share){
    try{await navigator.share({title,text,url:"https://www.gib.gov.tr/"});}catch{}
  } else {
    const t=title+"\n"+text+"\n\n"+$("dbody").innerText;
    try{await navigator.clipboard.writeText(t);$("d-share").textContent="Kopyalandı ✓";}
    catch{}
    setTimeout(()=>{$("d-share").textContent="Paylaş";},1800);
  }
};

/* ════════════════════════════
   SON EKLENEN ÖZELGELERc(Ana Sayfa)
════════════════════════════ */
async function loadSonEklenen(){
  try{
    const rc=await post("ozelge/list",
      {page:0,size:3,sortFieldName:"ozelgeTarih",sortType:"DESC"},
      {status:2,deleted:false,ktype:99});
    const items=rc.content||[];
    const box=$("son-ozelgeler");
    if(!items.length){box.innerHTML='<div style="padding:12px;text-align:center;color:var(--muted);font-size:13px;">Yüklenemedi</div>';return;}
    box.innerHTML="";
    items.forEach((it,i)=>{
      const el=document.createElement("button");
      el.className="recent-item";
      el.innerHTML=`<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <div><div class="ri-t">${esc(it.title||"(başlıksız)")}</div>
      <div class="ri-m">${fmtDate(it.ozelgeTarih)} · ${esc(it.kanunTitle||"")}</div></div>`;
      el.onclick=()=>openDetail(it);
      box.appendChild(el);
    });
  }catch{}
}

  try{

})();
